<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 16px;
        }

        .container{
            padding: 10px;
            width: 50%;
            background-color: rgb(244, 244, 244);
            margin: 150px auto;
            border: 1px solid rgb(217, 217, 217);
            padding: 20px;
        }

        h1{
            font-size: 36px;
        }

        h2{
            font-size: 1.5em;
            color: #515050;
        }

        .highlight{
            font-size: 2em;
            color: red;
            background-color: rgb(244, 220, 224);
        }

        p{
            font-size: 1rem;
            line-height: 1.5;
            color: #7f7d7d;
        }
    </style>
</head>
<body>
    <div class="container">
    <h1>Main Heading with Pixels</h1>
    <hr>
    <h2>Subheading with Ems</h2>
    <p>Body text using rems...</p>
    <p>Text with <span class="highlight">highlighted content</span> using ems.</p>

    </div>
</body>
</html>
