<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google FOnts Typography Hierarchy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&display=swap" rel="stylesheet">


</head>

<style>
    html{
        font-size: 20px;
    }
    body{
        font-size: 16px;
    }

    /* I choose these fonts because they are eye-catching. */
    h1{
        font-family: Changa One, serif;
    }

    h2{
        font-family: Changa One, serif;
    }

    h3{
        font-family: Changa One, serif;
    }

    h4{
        font-family: Changa One, serif;
    }

    p{
        font-family: Bebas Neue, sans-serif;
        font-size: 1.2em;
    }

    .pull-quote{
        font-family: Changa One, serif;
        color: deeppink;
        font-size: 1.2rem;
        /* Larger heading creates a clear hierarchy, while smaller body text maintains readability. */
    }

    article{
        background-color: #f0f0f0;
        margin: 50px auto;
        padding: 20px;
        width: 500px;
        border-radius: 8px;
    }
</style>

<body>
    <article>
        <h1>Main Article Title</h1>
        <p class="subtitle">Article subtitle or introduction</p>

        <p>First paragraph of content...</p>

        <h2>First Section Heading</h2>
        <p>More content...</p>

        <blockquote class="pull-quote">
            This is an important pull quote form the article
        </blockquote>

        <h3>Subsection Heading</h3>
        <p>Additional content...</p>

        <h4>Minor Heading</h4>
        <p>Final content section...</p>
    </article>

</body>
</html>
