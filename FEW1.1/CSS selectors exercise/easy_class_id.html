<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-title{
            color: blue;
            text-align: center;
        }

        .description{
            color: gray;
            font-size: 18px;
        }

        .btn{
            background-color: green;
            color: white;
            padding: 10px;
            border-radius: 5px;
            border: 0;
            margin-bottom: 16px;
        }

        #special-container{
            background-color: lightgray;
            padding: 20px;
            border: 2px solid black;
        }
    </style>

</head>
<body>
    <h1 class="main-title">Welcome to CSS Selectors</h1>
    <p class="description">This is a demonstration of using class and ID sleectors in CSS. Class selectors start with a dot (.) and ID selectors start with a hash (#).</p>
    <button class="btn">Click Me</button>
    <div id="special-container">
        This is a special container styled using an ID selector. IDs should be unique on a page, while classes can be reused.
    </div>
    
</body>
</html>
