<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: repeat(4, 2fr);
            grid-template-rows: repeat(2, 80px);
            gap: 15px;
        }

        .grid-item{
            height: 80px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .odd{
            background-color: lightblue;
        }

        .even{
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item odd">1</div>
        <div class="grid-item even">2</div>
        <div class="grid-item odd">3</div>
        <div class="grid-item even">4</div>
        <div class="grid-item odd">5</div>
        <div class="grid-item even">6</div>
        <div class="grid-item odd">7</div>
        <div class="grid-item even">8</div>
    </div>

</body>
</html>
