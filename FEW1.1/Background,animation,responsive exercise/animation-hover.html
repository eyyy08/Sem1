<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        width: 200px;
        height: 200px;
        background-color: blue;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .box:hover {
        background-color: red;
        box-shadow: 0 0 10px 5px gray;
        transition: 0.5s ease;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p>Hover over me</p>
    </div>
  </body>
</html>
