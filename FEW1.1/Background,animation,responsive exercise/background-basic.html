<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
      }

      .hero {
        background-image: url(https://picsum.photos/1200/800);
        background-size: cover;
        background-position: center;
        height: 800px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .text {
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-radius: 8px;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="text">
        <h1>Welcome to My Page</h1>
        <p>
          This is a hero section with a background image that covers the entire
          container and is centered.
        </p>
      </div>
    </div>
  </body>
</html>
