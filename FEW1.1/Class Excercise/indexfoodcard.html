<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza</title>
</head>
<style>
    .card{
        width: 300px;
        border-radius: 10px;
        background-color: white;
        margin: 8px auto;
        
    }

    img{
        border-radius: 10px 10px 0px 0px;
        width: 100%;
        height: 200px;
        object-fit: cover;
        
       
    }

    .card-content{
        padding: 20px;
    }

    .title{
        margin-bottom: 0px;
        margin-top: 0px;
        font-size: 20px;
    }

    .subtitle{
        margin-top: 2px;
        color: darkgray;
        font-size: 10px;
    }

    body{
        background-color: black;
    }

    .description{
        color: rgb(84, 83, 83);
        font-size: 14px;
        margin-bottom: 30px;
    }

    .type{
        border: 0px;
        border-radius: 10px;
        color: rgb(84, 83, 83);
        background-color: rgb(235, 235, 235);
        padding: 5px;
        display: inline;
        font-size: 10px;
        margin-right: 5px;
    }

    .price{
        color: darkorange;
        font-weight: bold;
        font-size: 30px;
        margin-bottom: 10px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .save{
        border: 2px solid darkorange;
        border-radius: 10px;
        padding: 10px;
        color: darkorange;
        background-color: white;
        width: 40%;
        margin-top: 0px;
    }

    .order{
        border: 2px solid darkorange;
        border-radius: 10px;
        color: white;
        background-color: darkorange;
        padding: 10px;
        width: 58%;
        margin-top: 0px;
    }
</style>

<body>
    <div class="card">
        <img src="https://slack-imgs.com/?c=1&o1=ro&url=https%3A%2F%2Fimages.unsplash.com%2Fphoto-1565299624946-b28f40a0ae38%3Fw%3D680%26q%3D80" alt="pizza">
        <div class="card-content">
            <h1 class="title">Margherita Pizza</h1>
            <h2 class="subtitle">ITALIAN CLASSIC</h2>
            
            <p class="description">Hand-strectched thin crust topped with fresh tomato sauce, creamy mozzarella, and gragrant basil leaves. Baked in a stone oven to perfection.</p>
            
            <p class="type">Vegetarian</p>
            <p class="type">Stone Baked</p>
            <p class="type">12''</p>

            <p class="price">$12.99</p>

            <button class="save">Save</button>
            <button class="order">Add to Order</button>
        </div>
    </div>

</body>
</html>
