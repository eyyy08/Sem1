<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ccd Card</title>
    <style>
        body{
            background-color: black;
        }

        .card{
            width: 300px;
            margin: 0px auto;
            border-radius: 16px;
            background-color: lightgoldenrodyellow;
        }

        img{
            width: 100%;
            border-radius: 16px 16px 0 0;
        }

        .card-content{
        padding: 16px;
        }

        .tags{
            background-color:lightpink ;
            width: fit-content;
            display: inline;
            padding: 5px;
            border-radius: 10px;
            font-size: 10px;
            margin-right: 5px;
        }

        .price{
            color: orange;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
           
        }

        .save{
            background-color: white;
            border: 2px solid orange;
            border-radius: 15px;
            color: orange;
            width: 35%;
            padding: 8px;
            margin-top: 0;
        }

        .order{
            background-color: orange;
            border: solid 0;
            color: white;
            width: 63%;
            padding: 8px;
            border-radius: 15px;
            margin-top: 0;
            border: 2px solid orange;
        }

        .title{
            margin: 0px;
            font-size: 20px;
        }

        .subtitle{
            margin-top: 2px;
            font-size: 12px;
            color: palevioletred;
        } 

        .description{
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://cdn.salla.sa/xArrjp/6687e6b7-1191-48b0-94c7-a3f33ac08baf-1000x1000-XUbr9VBzw6F663Kk4qRxoKA7Ro0AlocT0rTozAR7.png" alt="ccd camera">
            <div class="card-content">
                <h1 class="title">M26 CCD Digital Camera</h1>
                <p class="subtitle"><strong>GREEN COLOR</strong></p>

                <p class="description">If you are looking for a camera that is easy to use and takes good quality photos and videos, the M26 CCD (50MP/8x zoom) can be a practical and attractive choice, especially for beginners or everyday use.</p>

                <p class="tags">50 million ultra clear</p>
                <p class="tags">Pixels 8x</p>
                <p class="tags">light</p>

                <p class="price">$74.80</p>

                <button class="save">Save</button>
                <button class="order">Add to Order</button>
            </div>
    </div>
</body>
</html>
