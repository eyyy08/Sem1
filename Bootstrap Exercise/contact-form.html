<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.12.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center">Contact Us</h1>

      <form>
        <div class="form-group m-2">
          <label for="name">Name:</label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Enter your name"
          />
        </div>

        <div class="form-group m-2">
          <label for="email">Email:</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group m-2">
          <label for="subject">Subject:</label>
          <input
            type="text"
            class="form-control"
            id="subject"
            placeholder="Enter subject"
          />
        </div>

        <div class="form-group m-2">
          <label for="message">Message:</label>
          <textarea
            class="form-control"
            rows="5"
            id="message"
            placeholder="Enter your message"
          ></textarea>
        </div>

        <div class="dropdown m-2">
          <label for="how">How do you hear about us?</label>
          <button
            class="dropdown-toggle form-control text-start"
            data-bs-toggle="dropdown"
          >
            Select an option
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Instagram</a></li>
            <li><a class="dropdown-item" href="#">Facebook</a></li>
            <li><a class="dropdown-item" href="#">Rednote</a></li>
            <li><a class="dropdown-item" href="#">Others</a></li>
          </ul>
        </div>

        <button type="submit" class="btn btn-primary m-2">Submit</button>

        <div class="card p-3">
          <div class="card-body"></div>
          <h4 class="card-title mt-0">Contact Information</h4>
          <p class="card-text">
            <b>Address</b>: 123 Main Street, City, Country
          </p>
          <p class="card-text"><b>Phone</b>: +1(555)123-4567</p>
          <p class="card-text"><b>Email</b>: info@example.com</p>
        </div>
      </form>
    </div>
  </body>
</html>
