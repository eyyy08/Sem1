<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.12.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center">Bootstrap Utility Classes</h1>
      <p class="text-center fw-bold text-primary">
        This paragraph has blue text, is bold, and is centered.
      </p>
      <p class="bg-success text-white p-3">
        This paragraph has a green background, white text, and padding of size
        3.
      </p>
      <p class="bg-secondary text-end mt-4">
        This paragraph has a gray background, right-aligned text, and margin-top
        of size 4.
      </p>
      <div class="text-center">
        <button class="btn btn-primary mt-3">Centered Button</button>
      </div>

      <div class="shadow">
        <p class="p-3">This div has a shadow and contains some text.</p>
      </div>
    </div>
  </body>
</html>
