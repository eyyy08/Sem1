<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #box {
        width: 200px;
        height: 200px;
        background-color: red;
        transition: opacity 0.5s ease;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Challenge</h1>
    <p id="description">Use JavaScript to modify this webpage</p>
    <div id="container">
      <div id="box"></div>
    </div>

    <script>
      let heading = document.getElementById("heading");
      heading.textContent = "DOM Manipulation Challenge";

      let description = document.getElementById("description");
      description.textContent = "Use JS to modify this webpage";

      let box = document.getElementById("box");
      box.style.backgroundColor = "blue";

      let button = document.createElement("button");
      button.textContent = "Click Me";

      let container = document.getElementById("container");
      container.appendChild(button);

      button.addEventListener("click", function () {
        description.textContent =
          "Congratulations! You completed the DOM Manipulation Challenge!";

        button.remove();
      });

      box.addEventListener("mouseover", function () {
        box.style.opacity = "0.5";
      });

      box.addEventListener("mouseout", function () {
        box.style.opacity = "1.0";
      });

      box.addEventListener("click", function () {
        box.remove();
      });
    </script>
  </body>
</html>
