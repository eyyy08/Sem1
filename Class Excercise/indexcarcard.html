<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car For Sale</title>
    <style>
        .card  {
            width: 300px;
            border-radius: 12px;
            margin: auto;
            background-color: white;
        }

        img{
            border-radius: 12px 12px 0px 0px;
            width: 100%;
        }

        .sale  {
            border: 0px;
            border-radius: 20px;
            background-color: rgb(213, 255, 227);
            color: darkgreen;
            padding: 3px;
            font-size: 10px;
            width: 60px;
            text-align: center;
        }

       .year{
        margin-top: 0px;
        color: gray;
        font-size: 12px;
       }

       .text{
        padding: 20px;
       }

       .price{
        margin-top: 0px;
        color: red;
        margin-bottom: 10px;
       }

       .seller{
        border-radius: 12px;
        background-color: black;
        text-align: center;
        color: white;
        font-size: 12px;
        padding: 10px;
        margin-bottom: 2px;
        margin-top: 5px;
        width: 100%;
       }

       body{
        background-color: black;
       }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://slack-imgs.com/?c=1&o1=ro&url=https%3A%2F%2Fimages.unsplash.com%2Fphoto-1494976388531-d1058494cdd8%3Fw%3D680%26q%3D80" alt="2021 Ford Mustang GT">
            <div class="text">
                <p class="sale"><strong>FOR SALE</strong></p>
                <h3 style="margin-bottom: 10px;">2021 Ford Mustang GT</h3>
                <p class="year">Premium . Fastback . V8</p>
                <p style="font-size: 12px;">One owner, no accidents, Loaded with premium package, Brembo brakes, and active exhaust. Garage kept and meticulously maintained.</p>
                <h5 style="margin-bottom: 0px;">YEAR</h5>
                <p class="year">2021</p>
                <h2 class="price">$38,500</h2>
                <button class="seller">Contact Seller</button>
            </div>
    </div>
</body>
</html>
