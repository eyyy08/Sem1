<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Book Club Registration</h1>
    <p>Join our monthly book club where we read and discuss various genres of books. We meet every last Saturday of the month at the community library.</p>

    <p>Full name:</p>
    <input type="name" placeholder="Enter your full name">

    <p>Email:</p>
    <input type="email" placeholder="Enter your email address">

    <p>Favourite Book Genre:</p>
    <select name="Genre" id="Genre">
        <option value="1">fiction</option>
        <option value="1">non-fiction</option>
        <option value="1">fantasy</option>
        <option value="1">sci-fi</option>
        <option value="1">mystery</option>
    </select>

    <p>Why do you want to join our book club?</p>
    <textarea rows="5" cols="40" placeholder="Tell us why you're interested in joining our book club..."></textarea>

    <p>
    <button>Register</button>
    </p>
</body>
</html>
