<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table border="2" cellpadding="10">
      <!-- head -->
      <thead>
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
        </tr>
      </thead>

      <!-- body -->
      <tbody>
        <tr>
          <td>Computer</td>
          <td>RM 5,000</td>
          <td>2</td>
          <td>RM 10,000</td>
        </tr>
        <tr>
          <td>Chair</td>
          <td>RM 200</td>
          <td>6</td>
          <td>RM 1,200</td>
        </tr>
      </tbody>

      <!-- footer -->
      <tfoot>
        <tr>
          <th colspan="3">Total</th>
          <td>RM 11,200</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
