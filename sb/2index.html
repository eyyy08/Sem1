<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        width: 90%;
        border-collapse: collapse;
        font-weight: bold;
        background-color: #007a75;
      }

      th {
        text-align: left;
        color: #888;
        font-size: 12px;
        padding: 15px;
        border-bottom: 2px solid #05b8d4;
      }

      td {
        padding: 15px;
        border-bottom: 1px solid #1e2a33;
        color: white;
      }

      tbody tr:hover {
        background-color: #141d24;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>123</th>
          <th>123</th>
          <th>123</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>123</td>
          <td>123</td>
          <td>123</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
