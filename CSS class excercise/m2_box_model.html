<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m2</title>
    <style>
        .content-box{
            box-sizing: content-box;
            width: 300px;
            height: 200px;
            padding: 20px;
            border: 5px solid blue;
            background-color: #add8e6;
            border-radius: 25px;
            margin-bottom: 30px;
        }

        .border-box{
            box-sizing: border-box;
            width: 300px;
            height: 200px;
            padding: 20px;
            border: 5px solid blue;
            background-color: #add8e6;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h3>Content-Box</h3>
        <p>The div uses box-sizing: content-box. The total width is 300px + 20px (padding) + 5px (border) = 325px.</p>
    </div>

    <div class="border-box">
        <h3>Border-Box</h3>
        <p>This div uses box-sizing: border-box. The total width is exactly 300px, including padding and border.</p>
    </div>
    <!-- This is a medium exercise2. -->
</body>
</html>
